<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>College Content Management System</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1"/>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
</h:head>

<h:body styleClass="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <h:outputText value="College CMS"
                          styleClass="navbar-brand"/>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">

            <h1 class="display-5 fw-bold">
                College Content Management System
            </h1>

            <p class="fs-5">
                Manage and view college announcements.
            </p>

            <h:messages styleClass="text-danger"/>

            <div class="alert alert-info">
                <h:outputText
                    value="#{announcementBean.serviceStatus}"/>
            </div>

            <h2 class="h4 mb-3">Latest Announcements</h2>

            <ui:repeat value="#{announcementBean.announcements}"
                       var="announcement">

                <div class="card mb-3">
                    <div class="card-body">

                        <h3 class="h5 card-title">
                            <h:outputText value="#{announcement.title}"/>
                        </h3>

                        <p class="card-text">
                            <h:outputText
                                value="#{announcement.description}"/>
                        </p>

                        <span class="badge bg-primary">
                            <h:outputText value="#{announcement.category}"/>
                        </span>

                    </div>
                </div>

            </ui:repeat>

        </div>

        <footer class="text-center text-muted mb-4">
            Web Technology BE Practical
        </footer>

    </div>

</h:body>
</html>
